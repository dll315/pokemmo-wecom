services:
  pokemmo:
    build: .
    image: pokemmo-wecom-zh:local
    container_name: pokemmo-wecom-zh
    hostname: pokemmo-wecom
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-8787}:8787"
    volumes:
      - pokemmo_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pokemmo_data:
